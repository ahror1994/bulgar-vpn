name: BulgarVPN
options:
  bundleIdPrefix: com.bulgar
  deploymentTarget:
    iOS: "15.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
targets:
  BulgarVPN:
    type: application
    platform: iOS
    sources: [BulgarVPN]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bulgar.vpn
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Bulgar VPN
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
schemes:
  BulgarVPN:
    build:
      targets:
        BulgarVPN: all
